<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 1060 392" width="1060" height="392">
<defs>
<style>@font-face{font-family:'Rubik';font-weight:600;src:url(data:font/ttf;base64,) format('truetype');}</style>
<linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0b4fb3"/><stop offset=".55" stop-color="#1e88ff"/><stop offset="1" stop-color="#6fd0ff"/></linearGradient>
<linearGradient id="kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d3e3"/></linearGradient>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feFlood flood-color="#1e88ff" flood-opacity=".6"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="-60" y="-60" width="1060" height="392" fill="#05070c"/>
<g transform="skewX(-10)">
<!-- V -->
<polygon fill="url(#kg)" points="0,0 50,0 100,140 150,0 200,0 126,200 74,200"/>
<!-- N -->
<polygon fill="url(#kg)" transform="translate(220,0)" points="0,200 0,0 46,0 146,130 146,0 192,0 192,200 146,200 46,70 46,200"/>
<!-- X: clearly separated, real cross, full blue -->
<g transform="translate(470,0)" filter="url(#gl)">
  <!-- backslash \ -->
  <polygon fill="url(#bg)" points="8,0 58,0 208,200 158,200"/>
  <!-- slash / -->
  <polygon fill="url(#bg)" points="158,0 208,0 58,200 8,200"/>
</g>
<!-- T -->
<polygon fill="url(#kg)" transform="translate(720,0)" points="0,0 200,0 200,46 123,46 123,200 77,200 77,46 0,46"/>
</g>
<text x="470" y="282" text-anchor="middle" font-family="Rubik,Montserrat,Arial,sans-serif" font-weight="600" font-size="54" letter-spacing="14" fill="#ffffff">VERSA<tspan fill="#3b9bff">NEXT</tspan></text>
</svg>
